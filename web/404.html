<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 — Page Not Found | Pavise</title>
        <meta name="robots" content="noindex" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
        <script>
            (function() {
                var t = localStorage.getItem('pavise-theme');
                if (t) document.documentElement.setAttribute('data-theme', t);
                else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
            })();
        </script>
        <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            :root {
                --bg: #ebebeb; --surface: #f6f6f6; --border: rgba(28, 27, 42, 0.22);
                --text: #1c1b2a; --text-dim: rgba(28, 27, 42, 0.62);
                --mint: #28e99f; --mint-deep: #14c98a; --navy: #1c1b2a;
                --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
                --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
            }
            [data-theme="dark"] {
                --bg: #1c1b2a; --surface: #26253a; --border: rgba(244, 244, 246, 0.22);
                --text: #f4f4f6; --text-dim: rgba(244, 244, 246, 0.62);
            }
            html, body { height: 100%; }
            body {
                background: var(--bg); color: var(--text); font-family: var(--sans);
                display: flex; flex-direction: column; align-items: center;
                justify-content: center; min-height: 100vh; padding: 2rem; text-align: center;
                background-image:
                    linear-gradient(to right, rgba(28, 27, 42, 0.04) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(28, 27, 42, 0.04) 1px, transparent 1px);
                background-size: 56px 56px;
            }
            .brand {
                display: flex; align-items: center; gap: 0.5rem;
                font-size: 1.1rem; font-weight: 600; color: var(--text);
                text-decoration: none; margin-bottom: 3rem;
            }
            .code {
                font-family: var(--mono); font-size: 6rem; font-weight: 500;
                line-height: 1; letter-spacing: -0.04em; color: var(--text);
            }
            .code span { color: var(--mint); }
            h1 { font-size: 1.5rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; }
            p { color: var(--text-dim); font-size: 1rem; max-width: 36ch; margin: 0 auto 2rem; }
            .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
            .btn {
                --c: 10px;
                display: inline-block; padding: 12px 20px;
                font-family: var(--sans); font-size: 14px; font-weight: 500;
                text-decoration: none; transition: background 120ms ease, transform 120ms ease;
            }
            .btn:hover { transform: translateY(-1px); }
            .btn-primary {
                background: var(--mint); color: var(--navy); font-weight: 600;
                clip-path: polygon(0 0, calc(100% - var(--c)) 0, 100% var(--c), 100% 100%, var(--c) 100%, 0 calc(100% - var(--c)));
            }
            .btn-primary:hover { background: var(--mint-deep); }
            .btn-secondary {
                background: transparent; color: var(--text);
                border: 1px solid var(--border);
            }
        </style>
    </head>
    <body>
        <a href="/" class="brand">
            <svg width="18" height="23" viewBox="0 0 100 128" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M 50 4 L 88 14 L 83 100 Q 82 108 75 112 L 50 124 L 25 112 Q 18 108 17 100 L 12 14 Z" fill="#1c1b2a" />
                <path d="M 50 4 L 88 14 L 83 100 Q 82 108 75 112 L 50 124 Z" fill="#3d3b56" />
                <path d="M 50 4 L 50 124" stroke="#28e99f" stroke-width="4" />
                <path d="M 50 34 L 59 44 L 50 54 L 41 44 Z" fill="#28e99f" />
            </svg>
            Pavise
        </a>
        <div class="code">4<span>0</span>4</div>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <div class="links">
            <a href="/" class="btn btn-primary">Go home</a>
            <a href="/scan" class="btn btn-secondary">Open scanner</a>
        </div>
    </body>
</html>
