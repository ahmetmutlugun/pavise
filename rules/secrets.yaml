- id: QS-SEC-001
  title: "Google / Firebase API Key"
  pattern: "\\bAIza[0-9A-Za-z_-]{35}\\b"
  severity: warning
  category: secrets
  remediation: "Restrict the key in the Google Cloud / Firebase console to specific APIs, platforms, and app identifiers"

- id: QS-SEC-002
  title: "AWS Access Key ID"
  pattern: "\\bAKIA[0-9A-Z]{16}\\b"
  severity: high
  category: secrets
  cwe: "CWE-798"
  owasp_mobile: "M9"
  remediation: "Remove hardcoded AWS credentials; use IAM roles or environment variables"

- id: QS-SEC-003
  title: "AWS Secret Access Key"
  pattern: "(?i)aws.{0,20}['\"][0-9a-zA-Z/+]{40}['\"]"
  severity: high
  category: secrets
  cwe: "CWE-798"
  owasp_mobile: "M9"
  remediation: "Remove hardcoded AWS credentials; use IAM roles or environment variables"

# Require actual key body after the banner, not just the PEM header string.
# The bare banner appears as a string literal in crypto libraries (OpenSSL,
# BoringSSL) that never ship a key — matching it alone produced false HIGHs
# (e.g. SwissCovid's main binary). The trailing class includes whitespace so it
# spans the base64 body across newlines.
- id: QS-SEC-004
  title: "Private Key Material"
  pattern: "-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----[\\sA-Za-z0-9+/=]{40,}"
  severity: high
  category: secrets
  cwe: "CWE-321"
  owasp_mobile: "M9"
  remediation: "Never embed private keys in app binaries; use secure key management"

- id: QS-SEC-005
  title: "Generic API Key or Token"
  pattern: "(?i)(?:api[_-]?key|api[_-]?secret|access[_-]?token|auth[_-]?token)['\"]?[ \\t]*[:=][ \\t]*['\"]?[a-zA-Z0-9_\\-]{20,}['\"]?"
  severity: warning
  category: secrets
  cwe: "CWE-798"
  owasp_mobile: "M9"
  remediation: "Store sensitive tokens in the Keychain, not in code or configuration files"

- id: QS-SEC-006
  title: "Hardcoded Password"
  pattern: "(?i)(?:password|passwd|pwd)['\"]?[ \\t]*[:=][ \\t]*['\"][^'\"\\s]{8,}['\"]"
  severity: high
  category: secrets
  cwe: "CWE-259"
  owasp_mobile: "M9"
  remediation: "Never hardcode passwords; use secure credential storage"

- id: QS-SEC-007
  title: "Google OAuth Client ID"
  pattern: "[0-9]+-[a-z0-9_]{32}\\.apps\\.googleusercontent\\.com"
  severity: warning
  category: secrets
  remediation: "Restrict OAuth client ID to specific app bundle identifiers in Google Cloud Console"

- id: QS-SEC-008
  title: "Stripe Secret Key"
  pattern: "\\b(?:sk|rk)_(?:live|test)_[0-9a-zA-Z]{24,}\\b"
  severity: high
  category: secrets
  cwe: "CWE-798"
  remediation: "Use only publishable keys in mobile apps; never embed secret keys"

- id: QS-SEC-009
  title: "SendGrid API Key"
  pattern: "\\bSG\\.[a-zA-Z0-9_-]{22}\\.[a-zA-Z0-9_-]{43}\\b"
  severity: high
  category: secrets
  cwe: "CWE-798"
  remediation: "Remove SendGrid API keys from mobile apps"

- id: QS-SEC-010
  title: "GitHub Token"
  pattern: "\\b(?:gh[pousr]_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{82})\\b"
  severity: high
  category: secrets
  cwe: "CWE-798"
  remediation: "Remove GitHub tokens from mobile apps"

- id: QS-SEC-011
  title: "Slack Webhook URL"
  pattern: "https://hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[a-zA-Z0-9]+"
  severity: warning
  category: secrets
  remediation: "Rotate the Slack webhook URL and remove from app"

- id: QS-SEC-012
  title: "Twilio API Key"
  pattern: "\\bSK[0-9a-fA-F]{32}\\b"
  severity: high
  category: secrets
  cwe: "CWE-798"
  remediation: "Remove Twilio API keys from mobile apps"

- id: QS-SEC-013
  title: "Mailchimp API Key"
  pattern: "\\b[0-9a-f]{32}-us[0-9]{1,2}\\b"
  severity: warning
  category: secrets
  remediation: "Remove Mailchimp API keys from mobile apps"

- id: QS-SEC-014
  title: "Bearer Token in String"
  pattern: "(?i)\\bBearer[ \\t]+[a-zA-Z0-9_\\-\\.]{20,}"
  severity: warning
  category: secrets
  cwe: "CWE-798"
  remediation: "Do not hardcode bearer tokens; fetch them at runtime from secure storage"

- id: QS-SEC-015
  title: "Mapbox Secret Token"
  pattern: "\\bsk\\.eyJ1Ijoi[a-zA-Z0-9_-]{20,}\\.[a-zA-Z0-9_-]{20,}"
  severity: high
  category: secrets
  cwe: "CWE-798"
  remediation: "Restrict Mapbox token to specific URL patterns and bundle IDs in the Mapbox dashboard"

- id: QS-SEC-016
  title: "Algolia API Key"
  pattern: "(?i)algolia.{0,30}['\"]?[ \\t]*[:=]?[ \\t]*['\"][a-f0-9]{32}['\"]"
  severity: warning
  category: secrets
  cwe: "CWE-798"
  remediation: "Use search-only API keys in mobile apps; never embed Admin API keys"

- id: QS-SEC-017
  title: "Twilio Auth Token"
  pattern: "(?i)twilio.{0,20}['\"][0-9a-f]{32}['\"]"
  severity: high
  category: secrets
  cwe: "CWE-798"
  owasp_mobile: "M9"
  remediation: "Remove Twilio Auth Token from mobile apps; use server-side proxying"

# Real Mailgun keys are "key-" + 32 LOWERCASE HEX chars. The previous
# [0-9a-zA-Z]{32} matched concatenated symbol fragments like
# "key-encryptionenableCipherKeyEncrypt" (mixed case, non-hex) as false HIGHs.
- id: QS-SEC-018
  title: "Mailgun API Key"
  pattern: "\\bkey-[0-9a-f]{32}\\b"
  severity: high
  category: secrets
  cwe: "CWE-798"
  remediation: "Remove Mailgun API keys from mobile apps; call email APIs from your backend"

- id: QS-SEC-019
  title: "Intercom Secret Key"
  pattern: "(?i)intercom.{0,20}['\"][a-zA-Z0-9_-]{30,}['\"]"
  severity: warning
  category: secrets
  cwe: "CWE-798"
  remediation: "Use only the Intercom App ID in mobile apps; keep the secret key server-side"

- id: QS-SEC-020
  title: "HockeyApp / Crashlytics App Token"
  pattern: "(?i)(?:hockeyapp|fabric|crashlytics).{0,20}['\"][a-f0-9]{32}['\"]"
  severity: warning
  category: secrets
  cwe: "CWE-798"
  remediation: "Rotate the token; these tokens can allow unauthorized crash report access"

- id: QS-SEC-021
  title: "Hugging Face API Token"
  pattern: "\\bhf_[a-zA-Z0-9]{34,}\\b"
  severity: high
  category: secrets
  cwe: "CWE-798"
  remediation: "Remove Hugging Face tokens from mobile apps; proxy model calls through your backend"

- id: QS-SEC-022
  title: "Anthropic API Key"
  pattern: "\\bsk-ant-[a-zA-Z0-9_-]{80,}"
  severity: high
  category: secrets
  cwe: "CWE-798"
  remediation: "Remove Anthropic API keys from mobile apps; never expose LLM API keys client-side"

- id: QS-SEC-023
  title: "OpenAI API Key"
  pattern: "\\b(?:sk-(?:proj|svcacct|admin)-[a-zA-Z0-9_-]{40,}|sk-[a-zA-Z0-9]{48}\\b)"
  severity: high
  category: secrets
  cwe: "CWE-798"
  owasp_mobile: "M9"
  remediation: "Remove OpenAI API keys from mobile apps; proxy LLM calls through your backend"

- id: QS-SEC-024
  title: "Supabase Service Role Key"
  pattern: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\\.[a-zA-Z0-9_-]{50,}\\.[a-zA-Z0-9_-]{20,}"
  severity: high
  category: secrets
  cwe: "CWE-798"
  owasp_mobile: "M9"
  remediation: "Never embed Supabase service_role keys in mobile apps; use the anon key and RLS policies instead"

- id: QS-SEC-026
  title: "Azure Storage Account Key"
  pattern: "(?i)(?:AccountKey|azure.{0,20}key)['\"]?[ \\t]*[:=][ \\t]*['\"]?[a-zA-Z0-9+/]{86}=="
  severity: high
  category: secrets
  cwe: "CWE-798"
  owasp_mobile: "M9"
  remediation: "Remove Azure storage keys from mobile apps; use SAS tokens with minimal permissions"

- id: QS-SEC-027
  title: "Hardcoded Database Connection String"
  pattern: "(?i)\\b(?:mongodb(?:\\+srv)?|postgres(?:ql)?|mysql|mariadb|rediss?|amqps?|mssql)://[^\\s'\"<>/:@]+:[^\\s'\"<>/@]+@[^\\s'\"<>]{3,}"
  severity: high
  category: secrets
  cwe: "CWE-798"
  owasp_mobile: "M9"
  owasp_masvs: "MSTG-STORAGE-14"
  remediation: "Remove hardcoded database connection strings from the app bundle. Backend database credentials must never be shipped in a client binary; proxy all database access through a server-side API"

- id: QS-SEC-029
  title: "Stripe Publishable Key"
  pattern: "\\bpk_(?:live|test)_[0-9a-zA-Z]{24,}\\b"
  severity: info
  category: secrets
  remediation: "Publishable keys are meant to ship in clients; confirm no secret (sk_/rk_) key is bundled alongside"

- id: QS-SEC-030
  title: "Mapbox Public Token"
  pattern: "\\bpk\\.eyJ1Ijoi[a-zA-Z0-9_-]{20,}\\.[a-zA-Z0-9_-]{20,}"
  severity: info
  category: secrets
  remediation: "Public tokens are expected in clients; restrict them to your app's URLs and scopes in the Mapbox account"

- id: QS-SEC-031
  title: "Slack Token"
  # Bot (xoxb), user (xoxp), app-level (xapp) and legacy workspace tokens.
  pattern: "\\b(?:xox[abposr]-(?:[0-9]+-){1,3}[a-zA-Z0-9]{24,}|xapp-[0-9]-[A-Z0-9]+-[0-9]+-[a-f0-9]{32,})\\b"
  severity: high
  category: secrets
  cwe: "CWE-798"
  owasp_mobile: "M9"
  remediation: "Revoke the Slack token and move Slack API calls to a backend service"
