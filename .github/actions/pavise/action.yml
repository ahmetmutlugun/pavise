name: "Pavise IPA Scanner"
description: "Static security analysis for iOS IPA files"
branding:
  icon: shield
  color: blue

inputs:
  ipa-path:
    description: "Path to the IPA file to scan"
    required: true
  format:
    description: "Report format: sarif, json, html, or pdf (pdf needs Chrome on the runner)"
    default: "sarif"
  min-severity:
    description: "Lowest severity included in the report: high, warning, info, or secure"
    default: "info"
  fail-on:
    description: "Fail when a finding or secret at this severity or above exists: high, warning, info, or none"
    default: "high"
  version:
    description: "Pavise release tag (e.g. v0.1.0), or latest"
    default: "latest"

outputs:
  score:
    description: "Security score (0-100)"
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: "Security grade (A-F)"
    value: ${{ steps.scan.outputs.grade }}
  findings-count:
    description: "Number of findings and secrets in the report"
    value: ${{ steps.scan.outputs.findings_count }}
  report-path:
    description: "Path to the generated report"
    value: ${{ steps.scan.outputs.report_path }}

runs:
  using: "composite"
  steps:
    - name: Install Pavise
      shell: bash
      env:
        REPO: ahmetmutlugun/pavise
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ "$VERSION" = "latest" ]; then
          # The /releases/latest redirect names the tag; no API token needed.
          TAG=$(curl -fsSI "https://github.com/${REPO}/releases/latest" \
            | tr -d '\r' | sed -n 's#^[Ll]ocation: .*/tag/##p')
        else
          TAG="$VERSION"
        fi
        [ -n "$TAG" ] || { echo "::error::Could not resolve the latest Pavise release"; exit 1; }

        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)   TARGET="x86_64-unknown-linux-gnu" ;;
          Linux-aarch64)  TARGET="aarch64-unknown-linux-gnu" ;;
          Darwin-arm64)   TARGET="aarch64-apple-darwin" ;;
          Darwin-x86_64)  TARGET="x86_64-apple-darwin" ;;
          *) echo "::error::Unsupported runner: $(uname -s)-$(uname -m)"; exit 1 ;;
        esac

        DIR="${RUNNER_TEMP}/pavise"
        mkdir -p "$DIR"
        curl -fsSL "https://github.com/${REPO}/releases/download/${TAG}/pavise-${TAG}-${TARGET}.tar.gz" \
          | tar xz -C "$DIR" --strip-components=1
        echo "$DIR" >> "$GITHUB_PATH"
        "$DIR/pavise" --version

    - name: Run scan
      id: scan
      shell: bash
      env:
        IPA: ${{ inputs.ipa-path }}
        FORMAT: ${{ inputs.format }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
      run: |
        set -uo pipefail
        REPORT="pavise-report.${FORMAT}"
        JSON="${RUNNER_TEMP}/pavise-report.json"

        # Exit 1 means high findings (handled by fail-on below); 2 is a scan error.
        scan() {
          pavise "$IPA" "$@"
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error::Pavise could not scan ${IPA} (exit ${code})"
            exit "$code"
          fi
        }
        # The unfiltered JSON drives outputs and fail-on; the requested report
        # is a second run (scans take about a second).
        scan --format json --output "$JSON" --quiet
        scan --format "$FORMAT" --min-severity "$MIN_SEVERITY" --output "$REPORT" --quiet

        {
          echo "score=$(jq -r '.security_score' "$JSON")"
          echo "grade=$(jq -r '.grade' "$JSON")"
          echo "findings_count=$(jq '(.findings | length) + (.secrets | length)' "$JSON")"
          echo "report_path=${REPORT}"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### Pavise: $(jq -r '.app_info.name // "app"' "$JSON") — grade $(jq -r '.grade' "$JSON") ($(jq -r '.security_score' "$JSON")/100)"
          echo
          echo "| Severity | Findings | Secrets |"
          echo "|---|---|---|"
          for s in high warning info; do
            echo "| $s | $(jq --arg s "$s" '[.findings[] | select(.severity == $s)] | length' "$JSON") | $(jq --arg s "$s" '[.secrets[] | select(.severity == $s)] | length' "$JSON") |"
          done
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Enforce fail-on threshold
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        JSON="${RUNNER_TEMP}/pavise-report.json"
        case "$FAIL_ON" in
          none) exit 0 ;;
          high) LEVELS='["high"]' ;;
          warning) LEVELS='["high","warning"]' ;;
          info) LEVELS='["high","warning","info"]' ;;
          *) echo "::error::fail-on must be high, warning, info, or none (got '${FAIL_ON}')"; exit 1 ;;
        esac
        n=$(jq --argjson l "$LEVELS" '[(.findings[], .secrets[]) | select(.severity as $s | $l | index($s))] | length' "$JSON")
        if [ "$n" -gt 0 ]; then
          echo "::error::Pavise found ${n} finding(s) at or above '${FAIL_ON}'"
          exit 1
        fi
